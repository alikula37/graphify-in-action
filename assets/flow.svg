<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f1e"/>
      <stop offset="100%" stop-color="#052e2b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>

  <text x="450" y="36" fill="#edfffe" font-size="20" font-weight="700" text-anchor="middle">🧭 Graphify Flow — How the Agent Navigates</text>

  <!-- Step 1 -->
  <rect x="40" y="70" width="200" height="90" rx="10" fill="#0e3f3b" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="140" y="96" fill="#fde9ff" font-size="13" font-weight="700" text-anchor="middle">1️⃣ Agent asks</text>
  <text x="140" y="116" fill="#9fb8b5" font-size="11" text-anchor="middle">"which port is settings on?"</text>
  <text x="140" y="132" fill="#9fb8b5" font-size="11" text-anchor="middle">"how does backtest work?"</text>
  <text x="140" y="148" fill="#5f7a77" font-size="10" text-anchor="middle">raw scan blocked 🧊</text>

  <!-- Step 2 -->
  <rect x="350" y="70" width="200" height="90" rx="10" fill="#0e3f3b" stroke="#8b7cf6" stroke-width="1.6"/>
  <text x="450" y="96" fill="#fde9ff" font-size="13" font-weight="700" text-anchor="middle">2️⃣ Graph is queried</text>
  <text x="450" y="116" fill="#9fb8b5" font-size="11" text-anchor="middle">graphify query / path / explain</text>
  <text x="450" y="132" fill="#9fb8b5" font-size="11" text-anchor="middle">tree-sitter · offline · no API key 🌳</text>
  <text x="450" y="148" fill="#5f7a77" font-size="10" text-anchor="middle">focus within 562 nodes · 931 edges</text>

  <!-- Step 3 -->
  <rect x="660" y="70" width="200" height="90" rx="10" fill="#0e3f3b" stroke="#7ee8fa" stroke-width="1.6"/>
  <text x="760" y="96" fill="#fde9ff" font-size="13" font-weight="700" text-anchor="middle">3️⃣ Subgraph returns</text>
  <text x="760" y="116" fill="#9fb8b5" font-size="11" text-anchor="middle">~74-110 nodes · 1,694 tokens</text>
  <text x="760" y="132" fill="#9fb8b5" font-size="11" text-anchor="middle">instead of 7,580 lines 🎯</text>
  <text x="760" y="148" fill="#5f7a77" font-size="10" text-anchor="middle">agent goes to the right files</text>

  <!-- Arrows -->
  <line x1="240" y1="115" x2="348" y2="115" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="115" x2="658" y2="115" stroke="#8b7cf6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="40" y="220" width="400" height="80" rx="10" fill="#0e3f3b" stroke="#ffb3c1" stroke-width="1.6"/>
  <text x="240" y="246" fill="#fde9ff" font-size="13" font-weight="700" text-anchor="middle">4️⃣ Result saved to memory</text>
  <text x="240" y="266" fill="#9fb8b5" font-size="11" text-anchor="middle">graphify save-result --outcome useful | dead_end</text>
  <text x="240" y="284" fill="#5f7a77" font-size="10" text-anchor="middle">12 memories · 11 useful · 1 dead end (measured)</text>

  <!-- Step 5 -->
  <rect x="460" y="220" width="400" height="80" rx="10" fill="#0e3f3b" stroke="#fde9ff" stroke-width="1.6"/>
  <text x="660" y="246" fill="#fde9ff" font-size="13" font-weight="700" text-anchor="middle">5️⃣ Reflect extracts lessons</text>
  <text x="660" y="266" fill="#9fb8b5" font-size="11" text-anchor="middle">preferred vs tentative node · "re-verify" 🏷️</text>
  <text x="660" y="284" fill="#5f7a77" font-size="10" text-anchor="middle">qra.py 3× · jobs.py 2× → prioritized source</text>

  <!-- Bottom loop -->
  <line x1="240" y1="300" x2="240" y2="340" stroke="#ffb3c1" stroke-width="2"/>
  <line x1="240" y1="340" x2="660" y2="340" stroke="#fde9ff" stroke-width="2"/>
  <line x1="660" y1="340" x2="660" y2="302" stroke="#fde9ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="332" fill="#5f7a77" font-size="11" text-anchor="middle">next session: "check the verified source first" ♻️</text>

  <text x="450" y="380" fill="#5f7a77" font-size="11" text-anchor="middle">code changes → graphify update . → stale knowledge is flagged 🔄</text>
</svg>
