<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Graphify in Action</title>
<style>
  :root { --bg:#0b1f1e; --card:#0e3f3b; --card2:#0a3431; --teal:#2dd4bf; --pink:#fde9ff; --purple:#8b7cf6; --text:#c9dcda; --dim:#9fb8b5; --muted:#5f7a77; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:linear-gradient(160deg,#06201e,#0b1f1e 60%,#071616); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; line-height:1.6; padding:40px 20px; }
  .wrap { max-width:880px; margin:0 auto; }
  h1 { font-size:2.2rem; color:var(--pink); margin-bottom:8px; }
  .sub { color:var(--dim); font-size:1.05rem; margin-bottom:32px; }
  .hero { text-align:center; margin-bottom:36px; }
  .badge { display:inline-block; background:rgba(45,212,191,.12); color:var(--teal); border:1px solid rgba(45,212,191,.35); border-radius:999px; padding:4px 14px; font-size:.8rem; margin:0 4px 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:36px; }
  .card { background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:20px; }
  .card h3 { color:var(--pink); font-size:1rem; margin-bottom:10px; }
  .big { font-size:2.2rem; font-weight:800; color:var(--teal); }
  .big span { font-size:.9rem; color:var(--muted); font-weight:400; }
  .bar-wrap { background:#072624; border-radius:8px; padding:6px; margin-top:10px; }
  .bar { background:linear-gradient(90deg,var(--teal),var(--purple)); height:14px; border-radius:6px; }
  .mini { color:var(--muted); font-size:.78rem; margin-top:6px; }
  .flow { background:var(--card2); border-radius:14px; padding:20px; margin-bottom:36px; }
  .flow img { width:100%; border-radius:10px; }
  .steps { margin-bottom:36px; }
  .step { display:flex; gap:16px; margin-bottom:18px; background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:16px 18px; }
  .step .n { font-size:1.6rem; flex-shrink:0; }
  .step b { color:var(--pink); }
  .ok { color:var(--teal); } .no { color:#ff6b81; }
  .note { background:rgba(139,124,246,.08); border:1px solid rgba(139,124,246,.3); border-radius:12px; padding:16px; color:var(--dim); font-size:.9rem; margin-bottom:36px; }
  footer { color:var(--muted); font-size:.8rem; text-align:center; }
  .cmp { display:grid; gap:12px; margin-bottom:36px; }
  .cmp-row { display:grid; grid-template-columns:130px 1fr 1fr; gap:12px; background:var(--card); border-radius:10px; padding:12px 16px; font-size:.85rem; }
  .cmp-row .who { color:var(--pink); font-weight:600; }
  .cmp-row .pro { color:var(--teal); } .cmp-row .con { color:#ffb3c1; }
  .langbar { text-align:center; margin-bottom:20px; }
  .langbar button { background:rgba(45,212,191,.1); color:var(--teal); border:1px solid rgba(45,212,191,.4); border-radius:999px; padding:6px 16px; font-size:.85rem; cursor:pointer; margin:0 4px; }
  .langbar button.active { background:var(--teal); color:#052e2b; font-weight:700; }
  @media(max-width:600px){ .cmp-row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <button id="btn-en" onclick="setLang('en')">🇺🇸 English</button>
    <button id="btn-tr" onclick="setLang('tr')">🇹🇷 Türkçe</button>
  </div>

  <div class="hero">
    <h1 data-i18n="h1"></h1>
    <div class="sub" data-i18n="sub"></div>
    <div>
      <span class="badge" data-i18n="b1"></span>
      <span class="badge" data-i18n="b2"></span>
      <span class="badge" data-i18n="b3"></span>
      <span class="badge" data-i18n="b4"></span>
    </div>
  </div>

  <div class="grid">
    <div class="card"><h3 data-i18n="c1"></h3><div class="big">7.580 <span data-i18n="u_lines"></span></div><div class="mini" data-i18n="c1m"></div></div>
    <div class="card"><h3 data-i18n="c2"></h3><div class="big">562 <span data-i18n="u_nodes"></span></div><div class="mini" data-i18n="c2m"></div></div>
    <div class="card"><h3 data-i18n="c3"></h3><div class="big">1.694 <span data-i18n="u_tokens"></span></div><div class="mini" data-i18n="c3m"></div></div>
    <div class="card"><h3 data-i18n="c4"></h3><div class="big">12 <span data-i18n="u_mem"></span></div><div class="mini" data-i18n="c4m"></div></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 data-i18n="c5"></h3>
      <div class="bar-wrap"><div class="bar" style="width:100%"></div></div><div class="mini" data-i18n="c5a"></div>
      <div class="bar-wrap"><div class="bar" style="width:2.4%"></div></div><div class="mini" data-i18n="c5b"></div>
    </div>
    <div class="card">
      <h3 data-i18n="c6"></h3>
      <div class="big">%100 <span data-i18n="u_extr"></span></div>
      <div class="mini" data-i18n="c6a"></div>
      <div class="mini" data-i18n="c6b"></div>
    </div>
    <div class="card">
      <h3 data-i18n="c7"></h3>
      <div class="mini" data-i18n="c7a"></div>
      <div class="mini" data-i18n="c7b"></div>
      <div class="mini" data-i18n="c7c"></div>
      <div class="mini" data-i18n="c7d"></div>
    </div>
  </div>

  <div class="flow">
    <h3 style="color:var(--pink); margin-bottom:12px;" data-i18n="flow_h"></h3>
    <img id="flow-img" src="assets/flow.png" alt="Graphify flow diagram">
  </div>

  <div class="steps">
    <div class="step"><div class="n">1️⃣</div><div><b data-i18n="s1t"></b><span data-i18n="s1"></span></div></div>
    <div class="step"><div class="n">2️⃣</div><div><b data-i18n="s2t"></b><span data-i18n="s2"></span></div></div>
    <div class="step"><div class="n">3️⃣</div><div><b data-i18n="s3t"></b><span data-i18n="s3"></span></div></div>
    <div class="step"><div class="n">4️⃣</div><div><b data-i18n="s4t"></b><span data-i18n="s4"></span></div></div>
    <div class="step"><div class="n">5️⃣</div><div><b data-i18n="s5t"></b><span data-i18n="s5"></span></div></div>
  </div>

  <div class="cmp">
    <h3 style="color:var(--pink); margin-bottom:10px;" data-i18n="cmp_h"></h3>
    <div class="cmp-row"><span class="who">grep / ripgrep</span><span class="pro" data-i18n="cmp1p"></span><span class="con" data-i18n="cmp1c"></span></div>
    <div class="cmp-row"><span class="who">IDE + LSP</span><span class="pro" data-i18n="cmp2p"></span><span class="con" data-i18n="cmp2c"></span></div>
    <div class="cmp-row"><span class="who">Sourcegraph</span><span class="pro" data-i18n="cmp3p"></span><span class="con" data-i18n="cmp3c"></span></div>
    <div class="cmp-row"><span class="who">CodeQL/Semgrep</span><span class="pro" data-i18n="cmp4p"></span><span class="con" data-i18n="cmp4c"></span></div>
    <div class="cmp-row"><span class="who">Graphify</span><span class="pro" data-i18n="cmp5p"></span><span class="con" data-i18n="cmp5c"></span></div>
  </div>

  <div class="note" data-i18n="honest"></div>

  <footer data-i18n="footer"></footer>
</div>

<script>
const I18N = {
  en: {
    h1: "🧠 How Graphify Sped Up This Project",
    sub: "7,580 lines of code — managed with <b style='color:var(--teal)'>1,694 tokens per query</b> 🌱",
    b1: "🔒 Fully offline", b2: "🌳 Tree-sitter, no LLM", b3: "🧪 Real numbers", b4: "📐 Measured: 2026-08-16",
    c1: "📏 Codebase", u_lines: "lines", c1m: "67 files · 71,802 tokens (Python + TypeScript)",
    c2: "🗺️ Code graph", u_nodes: "nodes", c2m: "931 edges · 44 communities · 599 KB",
    c3: "🎯 Per query", u_tokens: "tokens", c3m: "2.4% of the code — 97.6% reduction",
    c4: "🧠 Memory", u_mem: "memories", c4m: "11 useful · 1 dead-end learned",
    c5: "💾 All info vs one query", c5a: "71,802 tokens — all code", c5b: "1,694 tokens — one query (2.4% of the code) 🎯",
    c6: "🔬 Extraction quality", u_extr: "extracted", c6a: "✓ 4/931 edges inferred (0.4%) · confidence 0.8", c6b: "✓ 0 API calls, 0 token cost",
    c7: "🏆 God nodes (core)", c7a: "📍 core prediction fn — 24 edges", c7b: "📍 connection helper — 21 edges", c7c: "📍 request helper — 19 edges", c7d: "📍 state builder — 13 edges",
    flow_h: "🧭 How does the agent navigate?",
    s1t: "Install: ", s1: "<code>graphify install --project --strict</code> — strict mode blocks the agent's raw source scan and routes it to the graph, then reverts to nudge mode (never gets stuck).",
    s2t: "Dead-end learned: ", s2: "the \"settings page\" query → the graph couldn't find it in our project → <span class='no'>dead end</span> flagged → never re-scanned. The real answer in one query: <b>it belongs to an older, unrelated project</b>.",
    s3t: "Debugging speed: ", s3: "backfill queue stuck (multi-layer error), an ensemble corner solution, a 31-second data fetch — all reached the right file in one step via <code>query/path</code>.",
    s4t: "Extracting lessons: ", s4: "<code>save-result</code> + <code>reflect</code> → <span class='ok'>ensemble module 3× · job module 2×</span> on the \"trusted source\" list; later sessions check there first.",
    s5t: "Stale-knowledge guard: ", s5: "when code changes, the related lesson gets a <b>\"re-verify\"</b> flag — no wrong routing from outdated info.",
    cmp_h: "⚖️ Quick comparison (details: docs/en/03-comparison.md)",
    cmp1p: "✅ everywhere, instant", cmp1c: "❌ no relationships, no agent context",
    cmp2p: "✅ great for humans", cmp2c: "❌ no programmatic agent context",
    cmp3p: "✅ enterprise, big repos", cmp3c: "❌ heavy server, not offline",
    cmp4p: "✅ real security analysis", cmp4c: "❌ requires rules, not navigation",
    cmp5p: "✅ offline AST graph + memory + agent-first", cmp5c: "❌ AST limits, API key for docs, gitignore discipline",
    honest: "⚠️ <b>Honesty note:</b> All numbers were measured on this project (graphify 0.9.43, 2026-08-16). The \"token savings\" percentage is the ratio of query output to the whole codebase. Exact measurements: lines/nodes/edges, file sizes, query output size.",
    footer: "🧠 Graphify-in-Action · source project: a financial forecasting platform · details in the <b>docs/</b> folder"
  },
  tr: {
    h1: "🧠 Graphify Bu Projeyi Nasıl Hızlandırdı?",
    sub: "7.580 satır kod — <b style='color:var(--teal)'>sorgu başına 1.694 token</b> ile yönetildi 🌱",
    b1: "🔒 Tamamen offline", b2: "🌳 Tree-sitter, LLM yok", b3: "🧪 Gerçek rakamlar", b4: "📐 Ölçüm: 2026-08-16",
    c1: "📏 Kod tabanı", u_lines: "satır", c1m: "67 dosya · 71.802 token (Python + TypeScript)",
    c2: "🗺️ Kod grafi", u_nodes: "node", c2m: "931 kenar · 44 topluluk · 599 KB",
    c3: "🎯 Sorgu başına", u_tokens: "token", c3m: "kodun %2,4'ü — %97,6 azalma",
    c4: "🧠 Hafıza", u_mem: "anı", c4m: "11 işe yaradı · 1 çıkmaz öğrenildi",
    c5: "💾 Tüm bilgi vs tek sorgu", c5a: "71.802 token — tüm kod", c5b: "1.694 token — tek sorgu (kodun %2,4'ü) 🎯",
    c6: "🔬 Ekstraksiyon kalitesi", u_extr: "extracted", c6a: "✓ 4/931 kenar çıkarımsal (%0.4) · güven 0.8", c6b: "✓ 0 API çağrısı, 0 token maliyeti",
    c7: "🏆 God node'lar (çekirdek)", c7a: "📍 çekirdek tahmin fn — 24 kenar", c7b: "📍 bağlantı yardımcısı — 21 kenar", c7c: "📍 istek yardımcısı — 19 kenar", c7d: "📍 state builder — 13 kenar",
    flow_h: "🧭 Ajan nasıl yönleniyor?",
    s1t: "Kurulum: ", s1: "<code>graphify install --project --strict</code> — strict mod, ajanın ham kaynak taramasını bloklayıp doğrudan grafa yönlendirir, sonra tekrar yönlendirmeye döner (takılmaz).",
    s2t: "Çıkmaz öğrenildi: ", s2: "\"settings sayfası\" sorgusu → graf bu sayfayı bizim projede bulamadı → <span class='no'>dead end</span> işaretlendi → bir daha aynı yola girilmiyor. Gerçek cevap tek sorguda: <b>o sayfa alakasız, eski bir projeye ait</b>.",
    s3t: "Hata ayıklama hızı: ", s3: "backfill kuyruğu takılması (çok katmanlı hata), ensemble köşe çözümü, 31 saniyelik veri çekişi — hepsinde <code>query/path</code> ile doğru dosyaya tek adımda ulaşıldı.",
    s4t: "Ders çıkarma: ", s4: "<code>save-result</code> + <code>reflect</code> → <span class='ok'>ensemble modülü 3× · job modülü 2×</span> \"güvenilir kaynak\" listesinde; sonraki oturumlar önce oraya bakıyor.",
    s5t: "Bayat bilgi koruması: ", s5: "kod değişince ilgili derse <b>\"yeniden doğrula\"</b> bayrağı basılıyor — eski bilgiyle yanlış yönlendirme olmuyor.",
    cmp_h: "⚖️ Kısa karşılaştırma (detay: docs/tr/03-karsilastirma.md)",
    cmp1p: "✅ her yerde var, anlık", cmp1c: "❌ ilişki yok, ajan için bağlam yok",
    cmp2p: "✅ insan için harika gezinme", cmp2c: "❌ ajan için programatik bağlam yok",
    cmp3p: "✅ kurumsal, dev repo", cmp3c: "❌ ağır sunucu, offline değil",
    cmp4p: "✅ gerçek güvenlik analizi", cmp4c: "❌ kural yazımı şart, gezinme değil",
    cmp5p: "✅ offline AST graf + bellek + ajan-first", cmp5c: "❌ AST sınırı, doküman için API key, gitignore disiplini şart",
    honest: "⚠️ <b>Dürüstlük notu:</b> Tüm rakamlar bu projede ölçüldü (graphify 0.9.43, 2026-08-16). \"Token tasarrufu\" yüzdeleri, sorgu çıktısının tüm kod tabanına oranıdır. Kesin ölçümler: satır/node/kenar sayıları, dosya boyutları, sorgu çıktısı boyutu.",
    footer: "🧠 Graphify-in-Action · kaynak proje: finansal tahminleme platformu · detaylar: <b>docs/</b> klasöründe"
  }
};

function setLang(lang) {
  document.documentElement.lang = lang;
  const d = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (d[k] !== undefined) el.innerHTML = d[k];
  });
  document.getElementById('flow-img').src = lang === 'tr' ? 'assets/flow.tr.png' : 'assets/flow.png';
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
  try { localStorage.setItem('gf-lang', lang); } catch(e) {}
}

const saved = (function(){ try { return localStorage.getItem('gf-lang'); } catch(e) { return null; } })();
const preferred = saved || ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en');
setLang(preferred);
</script>
</body>
</html>
